#===== Config file for filtering and aligning mNET-seq reads ===================


# Should intermediate file be kept
KEEP_INTERMEDIATE_FILES:
    False


# Should metaplot files be kept:
KEEP_META_FILES:
    False


# Library read geometry (controls UMI extraction and pause-position calling)
# * "qiaseq" - QIA-seq mNET-seq: UMI on read 2, RNA 3' end = aligned read 3'
#   end, read 1 sense. This is the default.
# * "rnet"   - RNET-seq (e.g. GSE147611): UMI on read 1, RNA 3' end = aligned
#   read 5' end, read 1 antisense (pause strand flipped).
# * Set this key here, in src/configs/net.yaml. A value set in SAMPLES.yaml or
#   in a genome config is silently ignored (see the note on TRIM_FILTER below).
READ_GEOMETRY:
  "qiaseq"


# Cutadapt arguments controlling which read pairs survive adapter trimming
# * If the value is omitted entirely (a bare "TRIM_FILTER:" with nothing after
#   it), this is derived from READ_GEOMETRY:
#   - "qiaseq" - " --pair-filter=first --discard-untrimmed ", the RNA 3' end is
#     only known for reads that sequenced into the 3' adapter
#   - "rnet"   - " --pair-filter=first ", the RNA 3' end is read 1's 5' end and
#     does not depend on the adapter being reached
# * Both defaults keep --pair-filter=first, which makes cutadapt apply every
#   filter (including --minimum-length) to read 1 only. Read 1 is the only read
#   that gets aligned, so a value that omits it will discard pairs based on
#   read 2 and silently lose usable reads
# * Setting TRIM_FILTER: "" is NOT the same as omitting the value. An empty
#   string is an explicit override meaning no filtering at all, which under
#   "qiaseq" admits untrimmed reads that place spurious pauses at a fixed offset
# * Set this key here, in src/configs/net.yaml. run.sh loads the config files in
#   the order SAMPLES.yaml, src/configs/net.yaml, src/configs/pauses.yaml, and
#   later files win, so a value set in SAMPLES.yaml or in a genome config is
#   silently ignored. The same applies to READ_GEOMETRY above
TRIM_FILTER:


# Base memory in GB to request for each rule
# * The actual amount requested will be higher for rules that generally
#   require more memory
# * A value of 8 will result in rules requesting between 1GB - 32GB of
#   memory
# * If left blank, requested memory will be calculated based on the size
#   of the input files for each rule
MEMORY:
  16


# Docker container to use for pipeline
CONTAINER:
  "docker://rmsheridan/find-pauses:v1.2.0"


## Additional parameters for various processing steps
# Cutadapt
# * The --pair-filter / --discard-untrimmed arguments are set by TRIM_FILTER
#   above, since they depend on READ_GEOMETRY
# --minimum-length    - remove reads that are shorter than given value
# -O                  - minimum overlap to trim adapter
# -a                  - adapter sequence for R1
# -A                  - adapter sequence for R2
#
# umi tools
# --method unique     - only remove read if the UMI sequence is an exact match
# --read-length       - use read length when removing duplicates
#
# featureCounts
# -s 0                - strandedness for read assignment; 0, unstranded
# -t gene             - feature type for counting
# -O                  - count if aligned to multiple features
CMD_PARAMS:
    cutadapt:      " --minimum-length 15 --overlap 10 "
    umi_pattern:   "NNNNNNNNNNNN"
    umi_tools:     " --method unique --read-length "
    featureCounts: " --extraAttributes 'gene_name,gene_biotype' -s 0 -t gene -O "
    computeMatrix: " --missingDataAsZero --skipZeros -q "


# Parameters to use when generating matrices using Deeptools
# 1. End of gene to use for reference when generating bins, can be "TSS",
#    "TES", or "center"  
# 2. Number of basepairs upstream of gene end
# 3. Number of basepairs downstream of gene end
# 4. Bin size in basepairs
META_MATRIX_PARAMS:
    - ["TSS", 2000, 2000, 100]
    - ["TES", 2000, 4000, 100]


